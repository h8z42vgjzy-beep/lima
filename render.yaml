# Deployment creates a PAID web service and persistent disk.
# Review the provider's cost summary before choosing Deploy Blueprint.
services:
  - type: web
    name: feindschaft-beta
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    buildCommand: node --check server.mjs && node --check public/app.js && npm test
    startCommand: npm start
    healthCheckPath: /api/me
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: F_DATA_DIR
        value: /var/data/feindschaft
    disk:
      name: feindschaft-data
      mountPath: /var/data
      sizeGB: 1
